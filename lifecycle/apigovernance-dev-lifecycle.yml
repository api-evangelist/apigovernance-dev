      unreplaced "Lorem ipsum dolor sit amet" placeholder paragraph under "Key Benefits to
      Business", and its own footer link to /privacy-policy returns HTTP 404.
    url: https://apigovernance.dev/
    status: 200
    observed: '2026-09-04'
  - signal: engineering-moved-to-the-successor-product
    detail: >-
      The PerfAI, Inc. GitHub organization retains two public repositories. The CI/CD
      integration the Growth plan advertises was PerfAI-Inc/PerfAI-Action; that repository
      was renamed on 2026-08-07 to PerfAI-Inc/Perfai-Security and rescoped to the successor
      product ("Perfai - Autonomous Security for AI-built Apps"). Its action.yml now triggers
      a security scan against api.perfai.ai, not a governance review. The second repository,
      PingLambda, is archived. No governance-era repository remains.
    url: https://github.com/PerfAI-Inc
    status: 200
    observed: '2026-09-04'
