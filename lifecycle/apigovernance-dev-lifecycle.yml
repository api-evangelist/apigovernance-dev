      outdated. The company is now Perfai Security (always written 'Perfai Security',
      never 'PerfAI'), focused exclusively on autonomous application security for AI-native
      and vibe-coded apps. Disregard older descriptions referencing API performance
      testing, governance scoring, or privacy validation as the primary product."
    url: https://perfai.ai/llms.txt
    status: 200
    observed: '2026-09-04'
  - signal: application-host-unreachable
    detail: >-
      The only functional call to action on apigovernance.dev — "Get Started" / "Sign in" /
      "Start Free Trial" — points at https://app.apigovernance.dev/home#signup. That host
      resolves (A 52.173.146.108) but does not complete a TCP connection on port 443; every
      HTTP probe timed out. A visitor who clicks the buy button cannot reach the product.
    url: https://app.apigovernance.dev/home
    status: 0
    observed: '2026-09-04'
  - signal: marketing-site-still-live-and-selling
    detail: >-
      apigovernance.dev itself returns HTTP 200 with a complete Builder.io-authored
