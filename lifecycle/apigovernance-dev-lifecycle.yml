  is legacy: its parent company has repositioned away from API governance and now sells a
  different product under a different name, while the APIGovernance.Dev marketing site is
  still served and still sells plans.
status: legacy
statusDetail: >-
  APIGovernance.Dev is one of seven single-purpose product domains PerfAI, Inc. cross-links
  from the apigovernance.dev footer (apiprivacy.com, apicontract.dev, apiperformance.dev,
  apirelease.dev, apiversion.dev, apitests.dev, apigovernance.dev). The parent company's own
  machine-readable statement of record now disclaims that whole line.
signals:
