note: >-
  Replaces the 2026-05-04 bulk-sweep scaffold (roadmap#35), which asserted five
  per-tier limits (10/100/1000 requests per minute, 1k/100k monthly quotas) and a
  full X-RateLimit-* header set that APIGovernance.Dev has never published anywhere.
  An honest zero is recorded instead. APIGovernance.Dev publishes no developer
  documentation, no API reference and no machine-readable contract: the entire public
  surface is the one-page marketing site at apigovernance.dev, and the application
  host it links to (app.apigovernance.dev) did not answer on port 443 when probed
  on 2026-09-04. There is therefore no documented rate limit, no documented response
  header, and no observable live response to read a limit from.
